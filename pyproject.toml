[project]
name = "kdm-api-starter-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bentoml>=1.3.16",
    "certifi>=2024.12.14",
    "openai>=1.58.1",
    "requests>=2.32.4",
    "truststore>=0.10.1",
    "PyMuPDF>=1.26.5",
    "pillow>=12.0.0",
    "requests>=2.32.5",
    "pydantic-ai>=1.44.0",
]

[tool.uv]
# Supply-chain cooldown: only resolve releases older than 7 days.
exclude-newer = "P7D"
# TEMPORARY until 2026-10-29: security releases of certifi younger than 7 days. The weekly
# dependency routine removes these entries once the locked versions are 7 days old.
exclude-newer-package = { dcc-backend-common = "P1D", certifi = "P0D" }
